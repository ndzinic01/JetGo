services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU11-ubuntu-22.04
    container_name: jetgo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${JETGO_SQL_SA_PASSWORD}"
    ports:
      - "${JETGO_SQL_HOST_PORT}:1433"
    volumes:
      - jetgo-sql-data:/var/opt/mssql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0.9-management
    container_name: jetgo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${JETGO_RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${JETGO_RABBITMQ_DEFAULT_PASS}"
    ports:
      - "${JETGO_RABBITMQ_AMQP_HOST_PORT}:5672"
      - "${JETGO_RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    volumes:
      - jetgo-rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: jetgo-mailpit
    ports:
      - "${JETGO_MAILPIT_SMTP_HOST_PORT}:1025"
      - "${JETGO_MAILPIT_WEB_HOST_PORT}:8025"
    restart: unless-stopped

  jetgo-api:
    build:
      context: .
      dockerfile: API/JetGo.API/Dockerfile
    container_name: jetgo-api
    depends_on:
      - sqlserver
      - rabbitmq
      - mailpit
    environment:
      ASPNETCORE_ENVIRONMENT: "${JETGO_API_ENVIRONMENT}"
      ASPNETCORE_URLS: "${JETGO_API_URLS}"
      JETGO_CONNECTION_STRING: "Server=${JETGO_DOCKER_SQL_HOST},${JETGO_DOCKER_SQL_PORT};Database=${JETGO_DATABASE_NAME};User Id=sa;Password=${JETGO_SQL_SA_PASSWORD};Encrypt=${JETGO_SQL_ENCRYPT};TrustServerCertificate=${JETGO_SQL_TRUST_SERVER_CERTIFICATE};MultipleActiveResultSets=${JETGO_SQL_MULTIPLE_ACTIVE_RESULT_SETS}"
      JETGO_JWT_ISSUER: "${JETGO_JWT_ISSUER}"
      JETGO_JWT_AUDIENCE: "${JETGO_JWT_AUDIENCE}"
      JETGO_JWT_KEY: "${JETGO_JWT_KEY}"
      JETGO_JWT_EXPIRY_MINUTES: "${JETGO_JWT_EXPIRY_MINUTES}"
      JETGO_RABBITMQ_HOST: "${JETGO_DOCKER_RABBITMQ_HOST}"
      JETGO_RABBITMQ_PORT: "${JETGO_RABBITMQ_PORT}"
      JETGO_RABBITMQ_USERNAME: "${JETGO_RABBITMQ_DEFAULT_USER}"
      JETGO_RABBITMQ_PASSWORD: "${JETGO_RABBITMQ_DEFAULT_PASS}"
      JETGO_RABBITMQ_VIRTUAL_HOST: "${JETGO_RABBITMQ_VIRTUAL_HOST}"
      JETGO_RABBITMQ_NOTIFICATIONS_QUEUE: "${JETGO_RABBITMQ_NOTIFICATIONS_QUEUE}"
      JETGO_PAYPAL_BASE_URL: "${JETGO_PAYPAL_BASE_URL}"
      JETGO_PAYPAL_CLIENT_ID: "${JETGO_PAYPAL_CLIENT_ID}"
      JETGO_PAYPAL_CLIENT_SECRET: "${JETGO_PAYPAL_CLIENT_SECRET}"
      JETGO_PAYPAL_RETURN_URL: "${JETGO_PAYPAL_RETURN_URL}"
      JETGO_PAYPAL_CANCEL_URL: "${JETGO_PAYPAL_CANCEL_URL}"
      JETGO_PAYPAL_CURRENCY_CODE: "${JETGO_PAYPAL_CURRENCY_CODE}"
      JETGO_PAYPAL_BAM_TO_CURRENCY_RATE: "${JETGO_PAYPAL_BAM_TO_CURRENCY_RATE}"
      JETGO_SMTP_HOST: "${JETGO_DOCKER_SMTP_HOST}"
      JETGO_SMTP_PORT: "${JETGO_SMTP_PORT}"
      JETGO_SMTP_USERNAME: "${JETGO_SMTP_USERNAME}"
      JETGO_SMTP_PASSWORD: "${JETGO_SMTP_PASSWORD}"
      JETGO_SMTP_USE_SSL: "${JETGO_SMTP_USE_SSL}"
      JETGO_SMTP_FROM_EMAIL: "${JETGO_SMTP_FROM_EMAIL}"
      JETGO_SMTP_FROM_NAME: "${JETGO_SMTP_FROM_NAME}"
      JETGO_CORS_ALLOWED_ORIGINS: "${JETGO_CORS_ALLOWED_ORIGINS}"
    ports:
      - "${JETGO_API_HTTP_HOST_PORT}:8080"
    restart: on-failure

  jetgo-worker:
    build:
      context: .
      dockerfile: Worker/JetGo.Worker/Dockerfile
    container_name: jetgo-worker
    depends_on:
      - sqlserver
      - rabbitmq
      - jetgo-api
    environment:
      DOTNET_ENVIRONMENT: "${JETGO_WORKER_ENVIRONMENT}"
      JETGO_CONNECTION_STRING: "Server=${JETGO_DOCKER_SQL_HOST},${JETGO_DOCKER_SQL_PORT};Database=${JETGO_DATABASE_NAME};User Id=sa;Password=${JETGO_SQL_SA_PASSWORD};Encrypt=${JETGO_SQL_ENCRYPT};TrustServerCertificate=${JETGO_SQL_TRUST_SERVER_CERTIFICATE};MultipleActiveResultSets=${JETGO_SQL_MULTIPLE_ACTIVE_RESULT_SETS}"
      JETGO_RABBITMQ_HOST: "${JETGO_DOCKER_RABBITMQ_HOST}"
      JETGO_RABBITMQ_PORT: "${JETGO_RABBITMQ_PORT}"
      JETGO_RABBITMQ_USERNAME: "${JETGO_RABBITMQ_DEFAULT_USER}"
      JETGO_RABBITMQ_PASSWORD: "${JETGO_RABBITMQ_DEFAULT_PASS}"
      JETGO_RABBITMQ_VIRTUAL_HOST: "${JETGO_RABBITMQ_VIRTUAL_HOST}"
      JETGO_RABBITMQ_NOTIFICATIONS_QUEUE: "${JETGO_RABBITMQ_NOTIFICATIONS_QUEUE}"
    restart: on-failure

volumes:
  jetgo-sql-data:
  jetgo-rabbitmq-data:
